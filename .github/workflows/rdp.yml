name: Temporary Windows Desktop (noVNC + Cloudflare)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    # Temporary GitHub-hosted runner, NOT a permanent VPS.
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Check required secret
        shell: pwsh
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VNC_PASSWORD)) {
            throw "Create repository secret VNC_PASSWORD first (use 8 characters or fewer for TightVNC compatibility)."
          }
          if ($env:VNC_PASSWORD.Length -gt 8) {
            throw "VNC_PASSWORD must be 8 characters or fewer for this VNC server."
          }

      - name: Install TightVNC
        shell: pwsh
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          choco install tightvnc --yes --no-progress `
            --install-arguments="SET_USEVNCAUTHENTICATION=1 VALUE_OF_USEVNCAUTHENTICATION=1 SET_PASSWORD=1 VALUE_OF_PASSWORD=$env:VNC_PASSWORD"
          $service = Get-Service -Name tvnserver -ErrorAction SilentlyContinue
          if ($null -eq $service) {
            throw "TightVNC service was not found after installation."
          }
          Set-Service -Name tvnserver -StartupType Automatic
          Start-Service -Name tvnserver
          Start-Sleep -Seconds 3
          Get-Service -Name tvnserver | Format-Table -AutoSize

      - name: Install noVNC and websockify
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install websockify
          $zip = "$env:TEMP\novnc.zip"
          $dest = "C:\novnc"
          Invoke-WebRequest `
            -Uri "https://github.com/novnc/noVNC/archive/refs/heads/master.zip" `
            -OutFile $zip
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath "$env:TEMP\novnc-src" -Force
          $source = Get-ChildItem "$env:TEMP\novnc-src" -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Copy-Item "$($source.FullName)\*" $dest -Recurse -Force
          if (-not (Test-Path "$dest\vnc.html")) {
            throw "Could not find noVNC vnc.html after extraction."
          }
          Write-Host "noVNC installed at $dest"

      - name: Start noVNC and Cloudflare Quick Tunnel
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # noVNC serves the browser client on 6080 and proxies WebSocket to VNC.
          $websockifyOut = "$env:TEMP\websockify-out.log"
          $websockifyErr = "$env:TEMP\websockify-err.log"
          $websockify = Start-Process -FilePath "python" `
            -ArgumentList @("-m", "websockify", "--web", "C:\novnc", "127.0.0.1:6080", "127.0.0.1:5900") `
            -PassThru -RedirectStandardOutput $websockifyOut -RedirectStandardError $websockifyErr

          # Download cloudflared.
          $cloudflared = "$env:TEMP\cloudflared.exe"
          Invoke-WebRequest `
            -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile $cloudflared

          $cfOut = "$env:TEMP\cloudflared-out.log"
          $cfErr = "$env:TEMP\cloudflared-err.log"
          $tunnel = Start-Process -FilePath $cloudflared `
            -ArgumentList @("tunnel", "--no-autoupdate", "--url", "http://127.0.0.1:6080") `
            -PassThru -RedirectStandardOutput $cfOut -RedirectStandardError $cfErr

          $url = $null
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2
            foreach ($log in @($cfOut, $cfErr)) {
              if (Test-Path $log) {
                $match = Select-String -Path $log `
                  -Pattern 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' `
                  -AllMatches | Select-Object -First 1
