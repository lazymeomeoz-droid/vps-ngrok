          choco install tightvnc --yes --no-progress `
            --install-arguments="SET_USEVNCAUTHENTICATION=1 VALUE_OF_USEVNCAUTHENTICATION=1 SET_PASSWORD=1 VALUE_OF_PASSWORD=$env:VNC_PASSWORD"
          $service = Get-Service -Name tvnserver -ErrorAction SilentlyContinue
          if ($null -eq $service) {
            throw "TightVNC service was not found after installation."
          }
          Set-Service -Name tvnserver -StartupType Automatic
          Start-Service -Name tvnserver
          Start-Sleep -Seconds 3
          Get-Service -Name tvnserver | Format-Table -AutoSize

      - name: Install noVNC and websockify
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install websockify
          $zip = "$env:TEMP\novnc.zip"
          $dest = "C:\novnc"
          Invoke-WebRequest `
            -Uri "https://github.com/novnc/noVNC/archive/refs/heads/master.zip" `
            -OutFile $zip
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath "$env:TEMP\novnc-src" -Force
          $source = Get-ChildItem "$env:TEMP\novnc-src" -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Copy-Item "$($source.FullName)\*" $dest -Recurse -Force
          if (-not (Test-Path "$dest\vnc.html")) {
            throw "Could not find noVNC vnc.html after extraction."
          }
          Write-Host "noVNC installed at $dest"

      - name: Start noVNC and Cloudflare Quick Tunnel
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Start noVNC's web server and WebSocket proxy.
          $websockifyOut = "$env:TEMP\websockify-out.log"
          $websockifyErr = "$env:TEMP\websockify-err.log"
          $websockify = Start-Process -FilePath "python" `
            -ArgumentList @("-m", "websockify", "--web", "C:\novnc", "127.0.0.1:6080", "127.0.0.1:5900") `
            -PassThru `
            -RedirectStandardOutput $websockifyOut `
            -RedirectStandardError $websockifyErr

          # Download cloudflared.
          $cloudflared = "$env:TEMP\cloudflared.exe"
          Invoke-WebRequest `
            -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile $cloudflared

          $cfOut = "$env:TEMP\cloudflared-out.log"
          $cfErr = "$env:TEMP\cloudflared-err.log"
          $tunnel = Start-Process -FilePath $cloudflared `
            -ArgumentList @("tunnel", "--no-autoupdate", "--url", "http://127.0.0.1:6080") `
            -PassThru `
            -RedirectStandardOutput $cfOut `
            -RedirectStandardError $cfErr

          $url = $null
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2

            foreach ($log in @($cfOut, $cfErr)) {
              if (Test-Path -LiteralPath $log) {
                $matches = Select-String -LiteralPath $log `
                  -Pattern 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' `
                  -AllMatches -ErrorAction SilentlyContinue

                if ($matches) {
                  foreach ($line in $matches) {
                    if ($line.Matches.Count -gt 0) {
                      $url = $line.Matches[0].Value
                      break
                    }
                  }
                }
              }

              if ($url) {
                break
              }
            }

            if ($url) {
              break
            }

            if ($tunnel.HasExited) {
              Write-Host "cloudflared stdout:"
              if (Test-Path -LiteralPath $cfOut) { Get-Content -LiteralPath $cfOut }
              Write-Host "cloudflared stderr:"
              if (Test-Path -LiteralPath $cfErr) { Get-Content -LiteralPath $cfErr }
              throw "cloudflared exited before creating a tunnel."
            }
          }

          if (-not $url) {
            Write-Host "cloudflared stdout:"
            if (Test-Path -LiteralPath $cfOut) { Get-Content -LiteralPath $cfOut }
            Write-Host "cloudflared stderr:"
            if (Test-Path -LiteralPath $cfErr) { Get-Content -LiteralPath $cfErr }
            throw "Could not find the Quick Tunnel URL in cloudflared logs."
          }

          $summary = @(
            "## Temporary Windows desktop"
            ""
            "Open: $url/vnc.html"
            ""
            "VNC password: the repository secret VNC_PASSWORD (not displayed here)."
            ""
            "Keep this workflow running while using the desktop."
          )
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          Write-Host "noVNC URL: $url/vnc.html"
          Write-Host "Keep this workflow running while using the desktop."

          while (-not $tunnel.HasExited -and -not $websockify.HasExited) {
            Start-Sleep -Seconds 15
          }

          Write-Host "websockify stdout:"
          if (Test-Path -LiteralPath $websockifyOut) { Get-Content -LiteralPath $websockifyOut }
          Write-Host "websockify stderr:"
          if (Test-Path -LiteralPath $websockifyErr) { Get-Content -LiteralPath $websockifyErr }
