name: Temporary Windows Desktop (noVNC + Cloudflare)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Check VNC password secret
        shell: pwsh
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VNC_PASSWORD)) {
            throw "Create a repository secret named VNC_PASSWORD first."
          }
          if ($env:VNC_PASSWORD.Length -gt 8) {
            throw "VNC_PASSWORD must be 8 characters or fewer for TightVNC compatibility."
          }

      - name: Install TightVNC
        shell: pwsh
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $installArgs = "SET_USEVNCAUTHENTICATION=1 VALUE_OF_USEVNCAUTHENTICATION=1 SET_PASSWORD=1 VALUE_OF_PASSWORD=$env:VNC_PASSWORD"
          choco install tightvnc --yes --no-progress --install-arguments="$installArgs"
          $service = Get-Service -Name tvnserver -ErrorAction SilentlyContinue
          if ($null -eq $service) {
            throw "TightVNC service was not found after installation."
          }
          Set-Service -Name tvnserver -StartupType Automatic
          Start-Service -Name tvnserver
          Start-Sleep -Seconds 3
          Get-Service -Name tvnserver | Format-Table -AutoSize

      - name: Install noVNC and websockify
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install websockify

          $zip = "$env:TEMP\novnc.zip"
          $sourceDir = "$env:TEMP\novnc-src"
          $dest = "C:\novnc"

          Invoke-WebRequest -Uri "https://github.com/novnc/noVNC/archive/refs/heads/master.zip" -OutFile $zip

          if (Test-Path -LiteralPath $sourceDir) {
            Remove-Item -LiteralPath $sourceDir -Recurse -Force
          }
          if (Test-Path -LiteralPath $dest) {
            Remove-Item -LiteralPath $dest -Recurse -Force
          }

          Expand-Archive -Path $zip -DestinationPath $sourceDir -Force
          $source = Get-ChildItem -LiteralPath $sourceDir -Directory | Select-Object -First 1
          if ($null -eq $source) {
            throw "Could not find the extracted noVNC directory."
          }

          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Copy-Item -Path "$($source.FullName)\*" -Destination $dest -Recurse -Force

          if (-not (Test-Path -LiteralPath "$dest\vnc.html")) {
            throw "Could not find noVNC vnc.html after extraction."
          }
          Write-Host "noVNC installed at $dest"

      - name: Start noVNC and Cloudflare Quick Tunnel
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $websockifyOut = "$env:TEMP\websockify-out.log"
          $websockifyErr = "$env:TEMP\websockify-err.log"
          $websockify = Start-Process -FilePath "python" `
            -ArgumentList @("-m", "websockify", "--web", "C:\novnc", "127.0.0.1:6080", "127.0.0.1:5900") `
            -PassThru `
            -RedirectStandardOutput $websockifyOut `
            -RedirectStandardError $websockifyErr

          $cloudflared = "$env:TEMP\cloudflared.exe"
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile $cloudflared

          $cfOut = "$env:TEMP\cloudflared-out.log"
          $cfErr = "$env:TEMP\cloudflared-err.log"
          $tunnel = Start-Process -FilePath $cloudflared `
